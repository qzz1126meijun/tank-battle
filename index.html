<title>🎮 坦克大战 - Tank Battle</title>

// ── 全局状态（纯数据，不在 update 中缓存引用）──
let map = [];
let player = null;
let enemies = [];
let bullets = [];
let explosions = [];
let score = 0;
let lives = 3;
let level = 0;
let enemiesSpawned = 0;
let enemiesKilled = 0;
let totalEnemies = MAX_ENEMIES;
let fireCooldown = 0;
let spawnTimer = 0;
let shakeTimer = 0;
let baseDestroyed = false;
let gameOver = false;
let respawnCountdown = 0;      // >0 = 死亡动画中；归零时复活
let prevRespawnCountdown = 0;  // 用于检测状态变化

// ── 按键 ──
const keys = [false, false, false, false, false]; // U R D L FIRE

const KEY_MAP = {
  'w':0,'W':0, 'ArrowUp':0,
  'd':1,'D':1, 'ArrowRight':1,
  's':2,'S':2, 'ArrowDown':2,
  'a':3,'A':3, 'ArrowLeft':3,
  ' ':4, 'j':4,'J':4,
};

document.addEventListener('keydown', function(e) {
  var idx = KEY_MAP[e.key];
  if (idx !== undefined) { e.preventDefault(); keys[idx] = true; return; }
  if (e.code === 'KeyR') { e.preventDefault(); resetGame(); }
});

document.addEventListener('keyup', function(e) {
  var idx = KEY_MAP[e.key];
  if (idx !== undefined) { e.preventDefault(); keys[idx] = false; }
});

// ── 辅助：AABB 碰撞 ──
function aabb(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

// ── Tank ──
function makeTank(x, y, dir, color, isPlayer) {
  var w = TILE - 4, h = TILE - 4;
  var speed = isPlayer ? PLAYER_SPEED : ENEMY_SPEED;
  return {
    x:x, y:y, w:w, h:h, dir:dir, color:color, isPlayer:!!isPlayer,
    speed:speed, alive:true,
    moveDir:dir,
    aiTimer:0, aiInterval: 50 + Math.floor(Math.random() * 70),
    stuck:0,
    invincible: isPlayer ? 120 : 0,
  };
}

function tankCenter(t) { return { x: t.x + t.w/2, y: t.y + t.h/2 }; }
function tankBounds(t) { return { left:t.x, right:t.x+t.w, top:t.y, bottom:t.y+t.h }; }

function tileAt(col, row) {
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return -1;
  return map[row * COLS + col];
}

function collidesTile(bx) {
  // 检查 bounds 占用的所有 tile
  var L = Math.floor(bx.left / TILE);
  var R = Math.floor((bx.right - 1) / TILE);
  var T = Math.floor(bx.top / TILE);
  var B = Math.floor((bx.bottom - 1) / TILE);

  // 确保范围有效
  if (L < 0) L = 0; if (R >= COLS) R = COLS-1;
  if (T < 0) T = 0; if (B >= ROWS) B = ROWS-1;

  for (var row = T; row <= B; row++) {
    for (var col = L; col <= R; col++) {
      var t = tileAt(col, row);
      if (t === BRICK || t === STEEL || t === BASE || t === WATER) return true;
    }
  }
  return false;
}

function tankCanMove(t, nx, ny) {
  if (nx < 0 || nx + t.w > canvas.width || ny < 0 || ny + t.h > canvas.height) return false;
  var b = { left:nx, right:nx+t.w, top:ny, bottom:ny+t.h };
  if (collidesTile(b)) return false;

  // 碰撞其他坦克
  var all = enemies.concat(player).filter(function(o) { return o && o.alive && o !== t; });
  for (var i = 0; i < all.length; i++) {
    if (aabb(b, tankBounds(all[i]))) return false;
  }
  return true;
}

function tankMove(t, dir) {
  var v = DIR_VEC[dir];
  var nx = t.x + v.x * t.speed;
  var ny = t.y + v.y * t.speed;
  // 垂直于移动方向的轴对齐到 TILE/2 网格
  var tx = t.x, ty = t.y;
  if (dir === 0 || dir === 2) tx = Math.round(t.x / (TILE/2)) * (TILE/2);
  else                       ty = Math.round(t.y / (TILE/2)) * (TILE/2);
  var fx = (dir === 0 || dir === 2) ? tx : nx;
  var fy = (dir === 1 || dir === 3) ? ty : ny;
  if (tankCanMove(t, fx, fy)) {
    t.x = fx; t.y = fy; t.dir = dir;
    return true;
  }
  return false;
}

function tankShoot(t) {
  var c = tankCenter(t);
  var v = DIR_VEC[t.dir];
  bullets.push({
    x: c.x + v.x * (t.w/2) - 2, y: c.y + v.y * (t.h/2) - 2,
    dir: t.dir, playerBullet: t.isPlayer, r: 3, alive: true
  });
}

// ── 初始化 ──
function loadLevel(idx) {
  map = LEVELS[idx % LEVELS.length].slice();
  enemies = [];
  bullets = [];
  explosions = [];
  enemiesSpawned = 0;
  enemiesKilled = 0;
  totalEnemies = MAX_ENEMIES;
  fireCooldown = 0;
  spawnTimer = 0;
  baseDestroyed = false;
  shakeTimer = 0;
  gameOver = false;
  respawnCountdown = 0;
  // 玩家出生
  player = makeTank(9*TILE+2, 18*TILE+2, 0, '#4ade80', true);
}

function resetGame() {
  score = 0;
  lives = 3;
  level = 0;
  loadLevel(0);
}

// ── 敌人生成 ──
function spawnEnemy() {
  if (enemiesSpawned >= totalEnemies) return;
  if (enemies.filter(function(e){return e.alive;}).length >= MAX_ONSCREEN) return;

  var spots = [
    {x:0, y:0},
    {x:12*TILE+2, y:0},
    {x:24*TILE+2, y:0},
  ];
  var sp = spots[Math.floor(Math.random() * spots.length)];

  // 检查占位
  for (var i = 0; i < enemies.length; i++) {
    if (!enemies[i].alive) continue;
    if (aabb({left:sp.x,right:sp.x+TILE-4,top:sp.y,bottom:sp.y+TILE-4}, tankBounds(enemies[i]))) return;
  }
  if (player && player.alive) {
    var pb = tankBounds(player);
    if (sp.x < pb.right+80 && sp.x+TILE-4 > pb.left-80 && sp.y < pb.bottom+80 && sp.y+TILE-4 > pb.top-80) return;
  }

  var colors = ['#f87171','#fbbf24','#fb923c','#e879f9','#38bdf8'];
  var t = makeTank(sp.x, sp.y, 2, colors[level % colors.length], false);
  t.speed = ENEMY_SPEED + level * 0.3;
  enemies.push(t);
  enemiesSpawned++;
}

// ── 敌人 AI ──
function enemyAI(e) {
  if (!e.alive) return;
  e.aiTimer++;

  var moved = tankMove(e, e.moveDir);
  if (moved) {
    e.stuck = 0;
  } else {
    e.stuck++;
    if (e.stuck >= 4) {
      // 卡住：反向优先
      e.moveDir = (e.moveDir + 2) % 4;
      e.stuck = 0;
      e.aiTimer = e.aiInterval;
    } else {
      e.moveDir = Math.floor(Math.random() * 4);
      e.aiTimer = e.aiInterval;
    }
  }

  if (e.aiTimer >= e.aiInterval) {
    e.aiTimer = 0;
    e.aiInterval = 40 + Math.floor(Math.random() * 80);
    if (player && player.alive && Math.random() < 0.4) {
      var dx = tankCenter(player).x - tankCenter(e).x;
      var dy = tankCenter(player).y - tankCenter(e).y;
      e.moveDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    } else {
      var opp = (e.moveDir + 2) % 4;
      var nd = Math.floor(Math.random() * 4);
      if (nd === opp && Math.random() < 0.6) nd = (nd + 1) % 4;
      e.moveDir = nd;
    }
  }

  if (Math.random() < 0.02) tankShoot(e);
}

// ── 复活 ──
function tryRespawn() {
  if (lives <= 0) {
    gameOver = true;
    console.log('[坦克大战] 生命耗尽，游戏结束');
    return;
  }

  var spots = [
    {x:9*TILE+2, y:18*TILE+2},
    {x:4*TILE+2, y:18*TILE+2},
    {x:14*TILE+2, y:18*TILE+2},
    {x:9*TILE+2, y:17*TILE+2},
    {x:4*TILE+2, y:17*TILE+2},
    {x:14*TILE+2, y:17*TILE+2},
  ];

  for (var s = 0; s < spots.length; s++) {
    var blocked = false;
    for (var i = 0; i < enemies.length; i++) {
      if (!enemies[i].alive) continue;
      if (aabb({left:spots[s].x,right:spots[s].x+TILE-4,top:spots[s].y,bottom:spots[s].y+TILE-4},
               tankBounds(enemies[i]))) { blocked = true; break; }
    }
    if (!blocked) {
      player = makeTank(spots[s].x, spots[s].y, 0, '#4ade80', true);
      console.log('[坦克大战] 复活成功');
      return;
    }
  }

  // 强制清场
  console.log('[坦克大战] 出生点被占，清除附近敌人');
  for (var i = 0; i < enemies.length; i++) {
    var eb = tankBounds(enemies[i]);
    if (eb.bottom > 16*TILE && eb.top < 20*TILE && eb.right > 3*TILE && eb.left < 16*TILE) {
      enemies[i].alive = false;
    }
  }
  player = makeTank(spots[0].x, spots[0].y, 0, '#4ade80', true);
}

// ── 主更新 ──
function update() {
  if (gameOver) return;

  // ── 1. 复活倒计时 ──
  prevRespawnCountdown = respawnCountdown;
  if (respawnCountdown > 0) {
    respawnCountdown--;
    if (respawnCountdown <= 0) {
      player = null; // 清除尸体（其实已经 alive=false 不会被渲染）
      tryRespawn();
    }
  }

  // ── 2. 冷却 ──
  if (fireCooldown > 0) fireCooldown--;
  if (shakeTimer > 0) shakeTimer--;

  // ── 3. 敌人生成 ──
  spawnTimer++;
  if (spawnTimer >= SPAWN_DELAY && enemiesSpawned < totalEnemies) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // ── 4. 基地被毁 → 直接 Game Over ──
  if (baseDestroyed) {
    gameOver = true;
    console.log('[坦克大战] 基地被毁');
    return;
  }

  // ── 5. 玩家操作 ──
  var p = player; // 本地引用（只用于活着时的操作；死亡时不操作）
  if (p && p.alive) {
    // 移动
    for (var d = 0; d < 4; d++) {
      if (keys[d]) tankMove(p, d);
    }
    // 射击
    if (keys[4] && fireCooldown <= 0) {
      tankShoot(p);
      fireCooldown = FIRE_COOLDOWN;
    }
    // 无敌倒计时
    if (p.invincible > 0) p.invincible--;
  }

  // ── 6. 敌人 AI ──
  for (var i = 0; i < enemies.length; i++) {
    enemyAI(enemies[i]);
  }

  // ── 7. 子弹飞行 ──
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (!b.alive) continue;
    var v = DIR_VEC[b.dir];
    b.x += v.x * BULLET_SPEED;
    b.y += v.y * BULLET_SPEED;

    // 出界
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { b.alive = false; continue; }

    // 地图碰撞
    var col = Math.floor(b.x / TILE), row = Math.floor(b.y / TILE);
    if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
      var tile = map[row * COLS + col];
      if (tile === BRICK) {
        map[row * COLS + col] = EMPTY;
        b.alive = false;
        explosions.push({x:col*TILE+TILE/2, y:row*TILE+TILE/2, life:10, big:false});
        continue;
      }
      if (tile === STEEL) {
        b.alive = false;
        explosions.push({x:b.x, y:b.y, life:6, big:false});
        continue;
      }
      if (tile === BASE) {
        map[row * COLS + col] = EMPTY;
        b.alive = false;
        baseDestroyed = true;
        explosions.push({x:col*TILE+TILE/2, y:row*TILE+TILE/2, life:30, big:true});
        continue;
      }
    }

    // 子弹对消
    for (var j = 0; j < bullets.length; j++) {
      var b2 = bullets[j];
      if (b2 === b || !b2.alive) continue;
      if (b2.playerBullet !== b.playerBullet) {
        var dx = b.x - b2.x, dy = b.y - b2.y;
        if (dx*dx + dy*dy < 36) { // 6px 半径
          b.alive = false; b2.alive = false;
          explosions.push({x:(b.x+b2.x)/2, y:(b.y+b2.y)/2, life:6, big:false});
          break;
        }
      }
    }
  }

  // ── 8. 子弹 vs 坦克 ──
  // 需要重新获取 player 引用（可能刚被复活，更新了全局 player）
  var pl = player;
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (!b.alive) continue;

    if (b.playerBullet) {
      // 玩家子弹 → 敌人
      for (var j = 0; j < enemies.length; j++) {
        if (!enemies[j].alive) continue;
        var eb = tankBounds(enemies[j]);
        if (b.x >= eb.left && b.x <= eb.right && b.y >= eb.top && b.y <= eb.bottom) {
          b.alive = false;
          enemies[j].alive = false;
          enemiesKilled++;
          score += 100;
          var ec = tankCenter(enemies[j]);
          explosions.push({x:ec.x, y:ec.y, life:15, big:false});
          shakeTimer = 6;
          break;
        }
      }
    } else {
      // 敌人子弹 → 玩家
      if (pl && pl.alive && pl.invincible <= 0) {
        var pb = tankBounds(pl);
        if (b.x >= pb.left && b.x <= pb.right && b.y >= pb.top && b.y <= pb.bottom) {
          b.alive = false;
          lives--;
          pl.alive = false;
          respawnCountdown = RESPAWN_DELAY;
          var pc = tankCenter(pl);
          explosions.push({x:pc.x, y:pc.y, life:25, big:true});
          shakeTimer = 15;
          console.log('[坦克大战] 玩家被击中！剩余生命:', lives, '复活倒计时:', RESPAWN_DELAY);
        }
      }
    }
  }

  // ── 9. 清理 ──
  bullets = bullets.filter(function(b){return b.alive;});
  enemies = enemies.filter(function(e){return e.alive;});
  for (var i = 0; i < explosions.length; i++) explosions[i].life--;
  explosions = explosions.filter(function(e){return e.life > 0;});

  // ── 10. 胜利 ──
  if (!gameOver && enemiesKilled >= totalEnemies) {
    console.log('[坦克大战] 关卡通关！');
    level++;
    loadLevel((level - 1) % LEVELS.length);
  }

  // ── 11. 失败 ──
  if (!gameOver && lives <= 0 && respawnCountdown <= 0 && !player) {
    gameOver = true;
    console.log('[坦克大战] 游戏结束');
  }
}

// ── 渲染 ──
function drawTile(x, y, tile) {
  if (tile === BRICK) {
    ctx.fillStyle = '#b45309';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#d97706';
    ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
    ctx.fillStyle = '#b45309';
    ctx.fillRect(x+2, y+TILE/2-1, TILE-4, 2);
    ctx.fillRect(x+TILE/2-1, y+2, 2, TILE-4);
  } else if (tile === STEEL) {
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#d1d5db';
    ctx.fillRect(x+3, y+3, TILE-6, TILE-6);
    ctx.fillStyle = '#9ca3af';
    ctx.fillRect(x+6, y+6, TILE-12, TILE-12);
  } else if (tile === WATER) {
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#3b82f6';
    for (var i = 0; i < 3; i++) ctx.fillRect(x+2, y+3+i*9, TILE-4, 4);
  } else if (tile === BASE) {
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#1c1917';
    ctx.beginPath();
    ctx.moveTo(x+TILE/2, y+5);
    ctx.lineTo(x+TILE-5, y+TILE-7);
    ctx.lineTo(x+TILE/2, y+TILE-12);
    ctx.lineTo(x+5, y+TILE-7);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTank(t) {
  if (!t || !t.alive) return;
  ctx.save();
  ctx.translate(t.x + t.w/2, t.y + t.h/2);
  ctx.rotate(t.dir * Math.PI/2);
  // 履带
  ctx.fillStyle = '#374151';
  ctx.fillRect(-t.w/2, -t.h/2, t.w/5, t.h);
  ctx.fillRect(t.w/2 - t.w/5, -t.h/2, t.w/5, t.h);
  // 车身
  ctx.fillStyle = t.color;
  ctx.fillRect(-t.w/2 + t.w/5, -t.h/2 + 2, t.w - t.w*2/5, t.h - 4);
  // 炮塔
  ctx.fillStyle = t.isPlayer ? '#22c55e' : '#1e293b';
  ctx.beginPath(); ctx.arc(0, 0, t.w*0.3, 0, Math.PI*2); ctx.fill();
  // 炮管
  ctx.fillStyle = t.isPlayer ? '#22c55e' : '#475569';
  ctx.fillRect(-2, -t.h/2, 4, t.h*0.4);
  ctx.restore();

  // 无敌闪烁
  if (t.invincible > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.abs(Math.sin(Date.now()/80))*0.6) + ')';
    ctx.fillRect(t.x-2, t.y-2, t.w+4, t.h+4);
  }
}

function drawExplosion(e) {
  var a = e.life / 30;
  var s = (30 - e.life) * (e.big ? 3 : 2);
  ctx.fillStyle = 'rgba(251,191,36,' + (a*0.6) + ')';
  ctx.beginPath(); ctx.arc(e.x, e.y, s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(249,115,22,' + (a*0.8) + ')';
  ctx.beginPath(); ctx.arc(e.x, e.y, s*0.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
  ctx.beginPath(); ctx.arc(e.x, e.y, s*0.25, 0, Math.PI*2); ctx.fill();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  var sx = 0, sy = 0;
  if (shakeTimer > 0) { sx = (Math.random()-0.5)*8; sy = (Math.random()-0.5)*8; }
  ctx.save();
  ctx.translate(sx, sy);

  // 背景 + 地图
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var row = 0; row < ROWS; row++) {
    for (var col = 0; col < COLS; col++) {
      drawTile(col*TILE, row*TILE, map[row*COLS+col]);
    }
  }

  // 坦克
  for (var i = 0; i < enemies.length; i++) drawTank(enemies[i]);
  drawTank(player);

  // 子弹
  for (var i = 0; i < bullets.length; i++) {
    if (!bullets[i].alive) continue;
    var b = bullets[i];
    ctx.fillStyle = b.playerBullet ? '#fbbf24' : '#f87171';
    ctx.shadowColor = b.playerBullet ? '#fbbf24' : '#f87171';
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 爆炸
  for (var i = 0; i < explosions.length; i++) drawExplosion(explosions[i]);

  // 复活倒计时 HUD
  if (respawnCountdown > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, canvas.height/2 - 30, canvas.width, 60);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('阵亡! 复活中... ' + Math.ceil(respawnCountdown/60) + 's', canvas.width/2, canvas.height/2 + 8);
    ctx.textAlign = 'start';
  }

  ctx.restore();
}

// ── UI ──
function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('enemies').textContent = totalEnemies - enemiesKilled;
  document.getElementById('level').textContent = level + 1;
  var ov = document.getElementById('gameOverText');
  if (gameOver) {
    ov.style.display = 'block';
    ov.textContent = baseDestroyed ? '基地被摧毁!' : '游戏结束';
  } else {
    ov.style.display = 'none';
  }
}

// ── 主循环 ──
function gameLoop() {
  try {
    update();
    render();
    updateUI();
  } catch (e) {
    console.error('[坦克大战] 错误:', e);
    // 即使出错也继续循环
  }
  requestAnimationFrame(gameLoop);
}

// ── 启动 ──
console.log('🎮 坦克大战 v2.0 已就绪');
resetGame();
gameLoop();

})();
</script>
